name: Daily Stock Monitors

on:
  workflow_dispatch:
  schedule:
    # UTC 周日到周四 23:00 = 北京时间周一到周五 07:00。GitHub 定时任务可能有几分钟延迟。
    - cron: "0 23 * * 0-4"

permissions:
  contents: write

jobs:
  run-monitors:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      REPORT_BASE_DIR: ${{ github.workspace }}/data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all monitors
        run: python run_all_monitors.py

      - name: Clean old reports and logs
        run: python cleanup_old_outputs.py

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update daily stock monitor reports"
            git push
          fi
